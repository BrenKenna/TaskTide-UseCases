frontend stats
    bind *:8080
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:password

global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend gluster_front
    bind *:24007
    default_backend gluster_nodes

backend gluster_nodes
    balance roundrobin
    option tcp-check
    server gluster-node1 gluster-node1:24007 check
    server gluster-node2 gluster-node2:24007 check
    server gluster-node3 gluster-node3:24007 check
