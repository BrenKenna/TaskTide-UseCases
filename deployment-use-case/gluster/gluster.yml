
# Internal subnet
networks:
  gluster_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
    external: false
  gluster_nlb:
    external: false


services:
  gluster-nlb:
    image: haproxy:alpine
    container_name: gluster-nlb
    ports:
      - "24007:24007"
      - "80:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      gluster_net:
          ipv4_address: 192.168.1.2
      gluster_nlb:
    restart: on-failure:3

  gluster-node1:
    image: gluster/gluster-centos:latest
    container_name: gluster-node1
    privileged: true
    volumes:
      - /mnt/brick1:/data/glusterfs/brick1
    networks:
      gluster_net:
        ipv4_address: 192.168.1.3
    command: >
      bash -c "
        mkdir -p /data/glusterfs/brick1/gv0
        /usr/sbin/glusterd -N &
        sleep 10 &&
        gluster peer probe gluster-node2 &&
        gluster peer probe gluster-node3

        sleep 5
        gluster volume create gv0 replica 3 gluster-node1:/data/glusterfs/brick1/gv0 gluster-node2:/data/glusterfs/brick2/gv0 gluster-node3:/data/glusterfs/brick3/gv0 force
        sleep 5
        gluster volume start gv0
        
        gluster volume status gv0
        gluster volume info gv0

        exec tail -f /dev/null
      "

  gluster-node2:
    image: gluster/gluster-centos:latest
    container_name: gluster-node2
    privileged: true
    volumes:
      - /mnt/brick2:/data/glusterfs/brick2
    networks:
      gluster_net:
        ipv4_address: 192.168.1.4
    command: >
      bash -c "
        mkdir -p /data/glusterfs/brick2/gv0
        /usr/sbin/glusterd -N
      "

  gluster-node3:
    image: gluster/gluster-centos:latest
    container_name: gluster-node3
    privileged: true
    volumes:
      - /mnt/brick3:/data/glusterfs/brick3
    networks:
      gluster_net:
        ipv4_address: 192.168.1.5
    command: >
      bash -c "
        mkdir -p /data/glusterfs/brick3/gv0
        /usr/sbin/glusterd -N
      "