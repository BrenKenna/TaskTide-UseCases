#########################################################################
#########################################################################
##
## Configuration for TaskTide-Engine Deployment with CouchDB backend
##
#########################################################################
#########################################################################


#######################################
#######################################
## 
## 1). Global Configs
## 
#######################################
#######################################

# Component networks
networks:
  dbNet:
    external: false

  tasktide_web:
    external: false

  tasktide_engine:
    external: false

  nginx_alb:
    external: false

secretes:
  couchDbPass:
    file: ./couchDB-pass.txt

services:

#############################################
#############################################
## 
## 2). CouchDB Service
## 
#############################################
#############################################

# CouchDB
  couchDB:
    networks:
      - dbNet

    ports:
      - "5984:5984"

    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD_FILE=/run/secretes/couchDB-pass.txt

    secretes:
      - couchDbPass

    volumes:
      - ./couchdb_data:/opt/couchdb/data


# Creates database
  initCouchDB:
    image: curlimages/curl:8.7.1
    depends_on:
      - couchdb
    volumes:
      - ./init-couchDB.sh:/opt/configDb.sh:ro
      - ./indexes.json:/opt/indexes:ro
    entrypoint: [ "/bin/sh", "/opt/configDb.sh" ]
    secrets:
      - couchDbPass


#############################################
#############################################
## 
## 2). TaskTide Web API
## 
#############################################
#############################################


# Spins-up 3 web apps
  tasktide_webapi:
    image: tasktide:latest
    networks:
      - tasktide
      - dbNet

    user: "1000:1000"

    volumes:
      - ./microprofile-config.properties:/opt/tasktide/config/META-INF/microprofile-config.properties

    working_dir: /opt/tasktide

    command:
        - web-api
        - --host
        - "tasktide_webapi"
        - --port
        - 80
        - --base-path
        - "/tasktide"

    deploy:
      replicas: 3
      restart_policy:
        condition: on-feature

    depends_on:
      - initCouchDB



#############################################
#############################################
## 
## 3). Application Load Balancer
## 
#############################################
#############################################

  nginx_alb:
    image: nginx:1.27-alpine
    container_name: tasktide_app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - tasktide_web
    depends_on:
      - tasktide_webapi