#########################################################################
#########################################################################
##
## Configuration for TaskTide-Engine Deployment with CouchDB backend
##
#########################################################################
#########################################################################


#######################################
#######################################
## 
## 1). Global Configs
## 
#######################################
#######################################

# Component networks
networks:
  dbNet:

  tasktide_web:

  tasktide_engine:

  nginx_alb:

secrets:
  couchDbPass:
    file: ./couchDB-pass.txt

services:

#############################################
#############################################
## 
## 2). CouchDB Service
## 
#############################################
#############################################


# CouchDB
  couchDB:
    container_name: "couchdb"
    image: "couchdb:2.3.1"
    
    networks:
      - dbNet

    ports:
      - "5984:5984"

    volumes:
      - ./couchdb_data:/opt/couchdb/data

    secrets:
      - couchDbPass


# Creates database admin:password
  initCouchDB:
    image: ubuntu:24.04
    networks:
      - dbNet
    volumes:
      - ./configDB.sh:/opt/configDB.sh:ro
      - ./indexes.json:/opt/indexes.json:ro
    entrypoint: [ "/bin/bash", "/opt/configDB.sh" ]
    secrets:
      - couchDbPass
    depends_on:
      - couchDB


#############################################
#############################################
## 
## 2). TaskTide Web API
## 
#############################################
#############################################


# Spins-up 3 web apps
  tasktide_webapi:
    # container_name: "tasktide-webapi"
    image: tasktide:latest
    networks:
      - tasktide_web
      - dbNet

    # ports:
    #  - "80:80"

    volumes:
      - ./microprofile-config.properties:/opt/tasktide/config/META-INF/microprofile-config.properties

    working_dir: /opt/tasktide

    command:
        - web-api
        - --host
        - "tasktide_webapi"
        - --port
        - "80"
        - --base-path
        - "/tasktide"

    deploy:
      replicas: 3

    depends_on:
      - initCouchDB



#############################################
#############################################
## 
## 3). Application Load Balancer
## 
#############################################
#############################################


  nginx_alb:
    image: nginx:1.27-alpine
    container_name: tasktide_app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - tasktide_web

    depends_on:
      - tasktide_webapi